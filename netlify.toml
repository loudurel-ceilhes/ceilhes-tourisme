[build]
  publish = "."
  # Colle une empreinte du contenu à l'adresse du style et du script
  # (styles.css?v=39135ee0). Sans elle, un navigateur qui a gardé l'ancienne
  # feuille de style continue de l'appliquer pendant des jours — c'est ce qui
  # affichait les photos de la galerie étirées quatre fois en hauteur alors que
  # la correction était en ligne. Détails dans scripts/version-assets.mjs.
  command = "node scripts/version-assets.mjs"

# Netlify retirait le « .html » des liens internes à la volée, alors que les
# balises canoniques, les og:url, le sitemap et les données structurées
# annoncent toutes l'adresse AVEC .html. Google voyait donc deux adresses pour
# chaque page. On coupe la réécriture : tout dit désormais la même chose.
[build.processing]
  skip_processing = false
[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/randonnees-vtt.html"
  to = "/randonnees.html"
  status = 301

# Les photos ne changent jamais sans changer de nom : on les garde un an.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Le style et le script changent à chaque correction. `no-cache` ne veut PAS
# dire « ne pas garder en mémoire » : le navigateur garde sa copie mais
# demande à chaque fois si elle est encore bonne. Si oui, le serveur répond
# « pas de changement » en quelques octets. Coût quasi nul, et fin des
# affichages bancals où un ancien style rencontre un nouveau contenu.
# (Vécu : après avoir rapatrié les polices, elles ne s'appliquaient pas —
# le navigateur servait le CSS de la veille pendant une heure.)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, no-cache"

# ⚠️ ORDRE IMPORTANT : cette règle vient APRÈS la précédente, sinon la règle
# générale /assets/* l'écrase. Chez Netlify, à égalité de correspondance,
# c'est la dernière déclarée qui l'emporte.
# Les polices ne changent jamais sans changer de nom : un an de cache.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sans ce type, le navigateur reçoit le manifeste en « octet-stream » et
# l'ignore : pas d'icône ni de nom corrects à l'ajout sur l'écran d'accueil.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"

# Sécurité de base.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
